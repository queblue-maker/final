<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 질문 코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: word cards on top like a vocabulary strip, then writing desk (left) and red-pen feedback sheet (right), attempt log at the bottom */
:root{
  --bg:#EEF1F6; --paper:#FFFFFF; --ink:#18213A; --muted:#5B6683; --line:#D7DDEA;
  --accent:#2F4FD8; --accent-soft:#E3E8FC;
  --hl:#FFE36E; --hl-ink:#3A3000;
  --red:#C9382A; --red-soft:#FBE7E4; --green:#1C7F55; --green-soft:#DFF3E9;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1424; --paper:#182038; --ink:#E8ECF7; --muted:#9AA5C4; --line:#2A3556;
  --accent:#8EA4FF; --accent-soft:#232F5A; --hl:#E9CB45; --hl-ink:#2A2200;
  --red:#FF7B6B; --red-soft:#3A1F22; --green:#5FD39E; --green-soft:#16362A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1424; --paper:#182038; --ink:#E8ECF7; --muted:#9AA5C4; --line:#2A3556;
  --accent:#8EA4FF; --accent-soft:#232F5A; --hl:#E9CB45; --hl-ink:#2A2200;
  --red:#FF7B6B; --red-soft:#3A1F22; --green:#5FD39E; --green-soft:#16362A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
header h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
header p{margin:2px 0 0;color:var(--muted)}
.levels{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.levels button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;font-weight:500}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* word strip */
.strip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.strip-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.words{display:flex;flex-wrap:wrap;gap:10px}
.word{font-family:var(--f-en);font-weight:600;font-size:22px;padding:6px 16px;border-radius:8px;border:2px dashed var(--line);color:var(--ink);transition:background .2s,border-color .2s}
.word.on{background:var(--hl);color:var(--hl-ink);border-color:transparent;border-style:solid}
.word.on::after{content:" ✓";font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:10px 20px}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.primary:disabled{opacity:.55;cursor:wait}
.custom{display:flex;flex-wrap:wrap;gap:8px}
.custom input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.desk,.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.desk h2,.sheet h2{font-family:var(--f-display);font-weight:600;font-size:20px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:14px;font-family:var(--f-en);font-size:20px;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.no{background:var(--red-soft);color:var(--red);border-color:transparent}
.submit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:var(--muted)}

.code-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.code-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit}
.disclosure{margin:0;text-align:center}

/* sheet */
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display)}
.score b{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-size:14px}
.marked{font-family:var(--f-en);font-size:20px;line-height:1.7;padding:12px 14px;border-radius:10px;background:var(--bg)}
.marked mark{background:none;color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:5px}
.section-label{font-weight:600;font-size:13.5px;color:var(--muted)}
.errors{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.err{border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 10px 10px 0;padding:10px 14px;display:grid;gap:4px}
.err-top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.err-part{font-family:var(--f-en);font-weight:600;color:var(--red)}
.err-type{font-size:12px;font-weight:600;color:var(--red)}
.err-fix{font-family:var(--f-en);color:var(--green);font-weight:600}
.reveal{border:0;background:none;color:var(--accent);padding:0;font-size:13px;font-weight:600;justify-self:start}
.allgood{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:500}
.corrected{border:1.5px solid var(--green);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.corrected p{margin:0;font-family:var(--f-en);font-size:19px;font-weight:600}
.locked{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.ladder{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:step}
.ladder li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li::before{counter-increment:step;content:counter(step);grid-row:span 3;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.ladder .lv{font-size:12.5px;font-weight:600;color:var(--accent)}
.ladder .en{font-family:var(--f-en);font-size:18px;font-weight:500}
.ladder .why{font-size:13.5px;color:var(--muted)}
.comment{font-size:14.5px;padding:12px 14px;background:var(--accent-soft);border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px 0;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.word{transition:none}}
.warn{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;font-size:14px}

/* history */
.history{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.history h2{font-family:var(--f-display);font-weight:600;font-size:18px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:14px}
@media (max-width:560px){.hist li{grid-template-columns:44px minmax(0,1fr)}.hist .bar{grid-column:2}}
.hist .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hist .s{font-family:var(--f-en);font-size:16px;overflow-wrap:anywhere}
.bar{height:8px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar-wrap{display:flex;align-items:center;gap:8px}
.bar-wrap .bar{flex:1}
.bar-wrap b{font-variant-numeric:tabular-nums;font-size:13px;width:26px;text-align:right}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Word → Question → Feedback → Level up</div>
      <h1>영어 <span>질문 코치</span></h1>
      <p>제시된 단어를 모두 넣어 영어 질문을 만들고, AI 피드백으로 문장을 다듬어 보세요.</p>
    </div>
    <div class="levels" role="group" aria-label="난이도">
      <button type="button" data-level="0" aria-pressed="true">기초</button>
      <button type="button" data-level="1" aria-pressed="false">중급</button>
      <button type="button" data-level="2" aria-pressed="false">심화</button>
    </div>
  </header>

  <section class="strip" aria-label="오늘의 단어">
    <div class="strip-top">
      <div class="eyebrow">오늘의 단어 · 모두 사용해야 해요</div>
      <div class="tools">
        <button class="btn" type="button" id="newWords">새 단어 받기</button>
        <button class="btn" type="button" id="toggleCustom">선생님이 직접 입력</button>
      </div>
    </div>
    <div class="words" id="words"></div>
    <form class="custom" id="customForm" hidden>
      <input id="customInput" placeholder="쉼표로 구분해 입력 (예: museum, visit, last weekend)" aria-label="직접 입력할 단어">
      <button class="btn" type="submit">단어 적용</button>
    </form>
  </section>

  <div class="main">
    <section class="desk" aria-label="질문 작성">
      <div>
        <div class="eyebrow" id="attemptLabel">시도 1</div>
        <h2>나의 영어 질문</h2>
      </div>
      <textarea id="answer" spellcheck="false" aria-label="영어 질문 입력" placeholder="예: Do you ...?"></textarea>
      <div class="checks" id="checks"></div>
      <label class="code-row" for="classCode"><span>수업 코드</span><input id="classCode" autocomplete="off" placeholder="선생님이 알려 준 코드"></label>
      <div class="submit-row">
        <span class="note" id="hintNote">단어를 모두 쓰고 물음표로 끝내면 준비 완료!</span>
        <button class="btn primary" type="button" id="submit">AI 피드백 받기</button>
      </div>
    </section>

    <section class="sheet" aria-label="AI 피드백" aria-live="polite" id="sheet"></section>
  </div>

  <p class="note disclosure">이 피드백은 사람이 아닌 AI(Claude)가 만든 것으로, 틀릴 수 있어요. 이름이나 연락처 같은 개인정보는 쓰지 마세요. 제출한 문장과 점수는 수업 개선을 위해 선생님이 볼 수 있어요.</p>

  <section class="history" aria-label="시도 기록">
    <h2>나의 성장 기록</h2>
    <ul class="hist" id="hist"></ul>
  </section>
</div>

<script>
const SETS = [
  [["library","borrow","weekend"],["breakfast","usually","eat"],["movie","favorite","why"],["friend","help","homework"],["summer","travel","family"],["music","listen","when"]],
  [["environment","protect","daily"],["smartphone","affect","sleep"],["volunteer","experience","community"],["future","career","prepare"],["culture","difference","understand"],["stress","exam","manage"]],
  [["artificial intelligence","replace","creativity"],["social media","influence","decision"],["climate change","responsibility","individual"],["success","define","happiness"],["technology","privacy","sacrifice"],["failure","learn","valuable"]]
];
const LEVEL_NAMES = ["기초 (고1 수준)","중급 (고2 수준)","심화 (고3 수준)"];

const EXAMPLE = {
  sentence:"Do you borrow book from library on weekend?",
  fb:{
    is_question:true,
    words:[{word:"library",used:true},{word:"borrow",used:true},{word:"weekend",used:true}],
    score:68,
    errors:[
      {part:"book",type:"명사의 수",hint:"빌리는 책이 한 권으로 정해져 있나요? 셀 수 있는 명사를 일반적으로 말할 때의 형태를 떠올려 보세요.",fix:"books"},
      {part:"from library",type:"관사",hint:"서로 알고 있는 특정 장소(동네 도서관)를 말할 때 명사 앞에 무엇이 필요할까요?",fix:"from the library"},
      {part:"on weekend",type:"전치사구 표현",hint:"'주말마다'처럼 반복되는 습관은 어떻게 표현할까요?",fix:"on weekends"}
    ],
    corrected:"Do you borrow books from the library on weekends?",
    levels:[
      {label:"자연스럽게",sentence:"How often do you borrow books from the library on weekends?",point:"How often으로 빈도를 물으면 Yes/No보다 대화가 길어져요."},
      {label:"구체적으로",sentence:"What kind of books do you usually borrow from the library on weekends?",point:"What kind of + 명사로 상대의 취향을 구체적으로 물어요."},
      {label:"깊이 있게",sentence:"Why do you prefer borrowing books from the library on weekends instead of buying them?",point:"prefer -ing와 instead of로 이유와 비교를 함께 묻는 고급 질문이에요."}
    ],
    comment:"세 단어를 모두 사용해 의문문을 정확한 어순으로 만들었어요! 명사의 수와 관사만 다듬으면 완벽한 질문이 됩니다."
  }
};

let level = 0, setIdx = 0, words = SETS[0][0];
let attempts = [];          // {sentence, score}
let current = null;         // {sentence, fb, example, revealed:Set, showCorrect:bool}
let busy = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function wordUsed(w, text){
  const t = text.toLowerCase();
  const parts = w.toLowerCase().split(/\s+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  // allow simple inflection on the last word: borrow → borrowed / borrowing / borrows
  const last = parts.pop();
  const stem = last.length > 4 && /e$/.test(last) ? last.slice(0,-1) : last;
  const re = new RegExp("\\b" + [...parts, stem + "[a-z]*"].join("\\s+") + "\\b");
  return re.test(t);
}

function renderWords(){
  const text = $("#answer").value;
  $("#words").innerHTML = words.map(w => `<span class="word${wordUsed(w,text)?" on":""}">${esc(w)}</span>`).join("");
  const used = words.filter(w => wordUsed(w,text)).length;
  const isQ = text.trim().endsWith("?");
  $("#checks").innerHTML =
    `<span class="pill ${used===words.length?"ok":"no"}">단어 ${used}/${words.length}</span>` +
    `<span class="pill ${isQ?"ok":(text.trim()?"no":"")}">${isQ?"물음표 ✓":"물음표로 끝내기"}</span>` +
    `<span class="pill">${text.trim()?text.trim().split(/\s+/).length:0} words</span>`;
}

function setWords(list){
  words = list;
  $("#answer").value = "";
  attempts = []; current = null;
  renderWords(); renderSheet(); renderHist();
  $("#attemptLabel").textContent = "시도 1";
}

function renderSheet(){
  const el = $("#sheet");
  if (busy){
    el.innerHTML = `<h2>AI 피드백</h2><div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 선생님이 빨간 펜을 드는 중…</div>`;
    return;
  }
  if (!current){
    el.innerHTML = `<h2>AI 피드백</h2><div class="empty">질문을 쓰고 <b>AI 피드백 받기</b>를 누르면<br>여기에 첨삭 결과가 나타나요.</div>` + availabilityWarn();
    return;
  }
  const {sentence, fb, example} = current;
  // mark error parts in student sentence
  let marked = esc(sentence);
  (fb.errors||[]).forEach(e => {
    const p = esc(e.part||"");
    if (p && marked.includes(p)) marked = marked.replace(p, `<mark>${p}</mark>`);
  });
  const wordPills = (fb.words||[]).map(w => `<span class="pill ${w.used?"ok":"no"}">${esc(w.word)} ${w.used?"✓":"✗"}</span>`).join("");
  const errs = (fb.errors||[]).length
    ? `<ul class="errors">${fb.errors.map((e,i)=>`
        <li class="err">
          <div class="err-top"><span class="err-type">${esc(e.type||"")}</span><span class="err-part">“${esc(e.part||"")}”</span></div>
          <div>💡 ${esc(e.hint||"")}</div>
          ${current.revealed.has(i)
            ? `<div>→ <span class="err-fix">${esc(e.fix||"")}</span></div>`
            : `<button class="reveal" type="button" data-reveal="${i}">고친 표현 보기</button>`}
        </li>`).join("")}</ul>`
    : `<div class="allgood">문법 오류가 없어요. 아래 단계로 문장을 발전시켜 보세요!</div>`;
  const corrected = current.showCorrect
    ? `<div class="corrected"><span class="section-label">바르게 고친 문장</span><p>${esc(fb.corrected||sentence)}</p></div>`
    : `<div class="locked"><span>먼저 힌트를 보고 스스로 고쳐 다시 제출해 보세요.</span><button class="btn" type="button" id="showCorrect">정답 문장 보기</button></div>`;
  const ladder = (fb.levels||[]).map(l => `<li><span class="lv">${esc(l.label||"")}</span><span class="en">${esc(l.sentence||"")}</span><span class="why">${esc(l.point||"")}</span></li>`).join("");
  el.innerHTML = `
    <div class="sheet-head">
      <div><div class="eyebrow">${example?"예시 피드백 · 직접 써서 받아보세요":"AI 피드백 · 시도 "+attempts.length}</div><h2>첨삭 결과</h2></div>
      <div class="score"><b>${Number(fb.score)||0}</b><span>/ 100</span></div>
    </div>
    <div class="marked">${marked}</div>
    <div class="checks">${wordPills}<span class="pill ${fb.is_question?"ok":"no"}">${fb.is_question?"의문문 ✓":"의문문이 아니에요"}</span></div>
    <div class="section-label">고칠 부분 (힌트 먼저!)</div>
    ${errs}
    ${corrected}
    <div class="section-label">한 단계 더 발전시키기</div>
    <ol class="ladder">${ladder}</ol>
    ${fb.comment?`<div class="comment">${esc(fb.comment)}</div>`:""}
    ${availabilityWarn()}`;
}

function availabilityWarn(){ return ""; }

function renderHist(){
  const el = $("#hist");
  if (!attempts.length){ el.innerHTML = `<li class="note" style="display:block">아직 제출한 질문이 없어요. 고쳐 쓸 때마다 점수가 어떻게 변하는지 여기서 볼 수 있어요.</li>`; return; }
  el.innerHTML = attempts.map((a,i)=>`<li><span class="n">#${i+1}</span><span class="s">${esc(a.sentence)}</span><span class="bar-wrap"><span class="bar"><i style="width:${Math.max(0,Math.min(100,a.score))}%"></i></span><b>${a.score}</b></span></li>`).join("");
}

// 수업 코드는 이 브라우저에만 기억 (서버에서 확인)
function getCode(){ try{ return localStorage.getItem("classCode") || ""; }catch{ return ""; } }
function setCode(v){ try{ localStorage.setItem("classCode", v); }catch{} }

async function submit(){
  const sentence = $("#answer").value.trim().replace(/\s+/g," ");
  if (!sentence){ $("#hintNote").textContent = "먼저 영어 질문을 써 주세요."; $("#answer").focus(); return; }
  const classCode = $("#classCode").value.trim();
  if (!classCode){ $("#hintNote").textContent = "선생님이 알려 준 수업 코드를 먼저 입력해 주세요."; $("#classCode").focus(); return; }
  setCode(classCode);
  if (location.protocol === "file:"){
    $("#hintNote").textContent = "내 컴퓨터에서 파일을 직접 열면 AI 피드백이 작동하지 않아요. Vercel 배포 주소(https://….vercel.app)로 열어 주세요.";
    return;
  }
  busy = true; $("#submit").disabled = true; renderSheet();
  try{
    const r = await fetch("/api/feedback", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ classCode, sentence, words, level, previous: attempts.slice(-3) })
    });
    const fb = await r.json().catch(() => ({}));
    if (r.status === 404) throw new Error("서버 함수(/api/feedback)를 찾지 못했어요. GitHub에 api 폴더 안 feedback.js가 있는지 확인해 주세요.");
    if (!r.ok) throw new Error(fb.error || `피드백을 받지 못했어요. (오류 ${r.status})`);
    attempts.push({sentence, score: Math.round(Number(fb.score)||0)});
    current = {sentence, fb, example:false, revealed:new Set(), showCorrect:false};
    $("#attemptLabel").textContent = "시도 " + (attempts.length+1);
    $("#hintNote").textContent = "힌트를 보고 고쳐서 다시 제출해 보세요!";
  }catch(e){
    $("#hintNote").textContent = e && e.message ? e.message : "피드백을 받지 못했어요. 다시 시도해 주세요.";
  }finally{
    busy = false; $("#submit").disabled = false; renderSheet(); renderHist();
  }
}

// events
$("#answer").addEventListener("input", renderWords);
$("#answer").addEventListener("keydown", e => { if (e.key==="Enter" && (e.ctrlKey||e.metaKey)) submit(); });
$("#submit").addEventListener("click", submit);
$("#newWords").addEventListener("click", () => {
  const sets = SETS[level]; let n; do { n = Math.floor(Math.random()*sets.length); } while (sets.length>1 && n===setIdx);
  setIdx = n; setWords(sets[n]);
});
$("#toggleCustom").addEventListener("click", () => { const f=$("#customForm"); f.hidden=!f.hidden; if(!f.hidden) $("#customInput").focus(); });
$("#customForm").addEventListener("submit", e => {
  e.preventDefault();
  const list = $("#customInput").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,6);
  if (list.length){ setWords(list); $("#customForm").hidden = true; }
});
document.querySelectorAll(".levels button").forEach(b => b.addEventListener("click", () => {
  level = Number(b.dataset.level);
  document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
  setIdx = 0; setWords(SETS[level][0]);
}));
$("#sheet").addEventListener("click", e => {
  const r = e.target.closest("[data-reveal]");
  if (r && current){ current.revealed.add(Number(r.dataset.reveal)); renderSheet(); }
  if (e.target.id==="showCorrect" && current){ current.showCorrect = true; renderSheet(); }
});

// initial example state
$("#answer").value = EXAMPLE.sentence;
current = {sentence:EXAMPLE.sentence, fb:EXAMPLE.fb, example:true, revealed:new Set([0]), showCorrect:false};
renderWords(); renderSheet(); renderHist();

$("#classCode").value = getCode();
</script>
</body>
</html>
